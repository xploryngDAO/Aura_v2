    <script>
      // Gracefully prevent transient WebSocket disconnects in iframe dev previews from halting runtime
      window.addEventListener('error', function(e) {
        var str = (e && (e.message || (e.error && (e.error.message || String(e.error))) || String(e))) || '';
        if (str.includes('WebSocket') || str.includes('closed without opened') || str.includes('vite')) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = (e && (e.reason && (e.reason.message || String(e.reason)))) || '';
        if (str.includes('WebSocket') || str.includes('closed without opened') || str.includes('vite')) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
